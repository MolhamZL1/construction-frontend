<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>متقن | إدارة مشاريع الإكساء</title>
      <link rel="icon" type="image/svg+xml" href="/branding/icon-color.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1C2624" />
    <meta name="description" content="متقن - منصة ذكية لإدارة مشاريع إكساء الشقق السكنية" />
  
    <style>
      /* MUTQIN_APP_BOOT_LOADER */
      #app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 44%, rgba(201, 154, 70, 0.09), transparent 28%),
          #f6f2ea;
        opacity: 1;
        visibility: visible;
        transition: opacity 360ms ease, visibility 360ms ease;
      }

      #app-boot-loader.app-boot-loader--exit {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .mutqin-app-loader {
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .mutqin-app-loader__stage {
        position: relative;
        display: grid;
        width: 92px;
        height: 92px;
        place-items: center;
      }

      .mutqin-app-loader__ring {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(28, 38, 36, 0.1);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.62);
        box-shadow: 0 20px 55px rgba(28, 38, 36, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        animation: mutqin-loader-ring 3.2s cubic-bezier(.22, 1, .36, 1) infinite;
      }

      .mutqin-app-loader__ring::before,
      .mutqin-app-loader__ring::after {
        position: absolute;
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background: #c99a46;
        box-shadow: 0 0 0 5px rgba(201, 154, 70, 0.1);
      }

      .mutqin-app-loader__ring::before {
        top: -3px;
        left: 50%;
        transform: translateX(-50%);
      }

      .mutqin-app-loader__ring::after {
        right: -3px;
        top: 50%;
        transform: translateY(-50%);
      }

      .mutqin-app-loader__logo {
        position: relative;
        z-index: 2;
        display: block;
        width: 48px;
        height: 48px;
        object-fit: contain;
        animation: mutqin-loader-logo 1.55s ease-in-out infinite;
      }

      .mutqin-app-loader__build {
        display: flex;
        height: 19px;
        align-items: flex-end;
        justify-content: center;
        gap: 4px;
      }

      .mutqin-app-loader__build i {
        display: block;
        width: 5px;
        border-radius: 2px 2px 1px 1px;
        background: #1c2624;
        transform-origin: bottom;
        animation: mutqin-loader-build 1.35s cubic-bezier(.22, 1, .36, 1) infinite;
      }

      .mutqin-app-loader__build i:nth-child(1) { height: 8px; }
      .mutqin-app-loader__build i:nth-child(2) { height: 14px; animation-delay: 90ms; }
      .mutqin-app-loader__build i:nth-child(3) { height: 19px; background: #c99a46; animation-delay: 180ms; }
      .mutqin-app-loader__build i:nth-child(4) { height: 12px; animation-delay: 270ms; }

      .mutqin-app-loader__track {
        position: relative;
        width: 112px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(28, 38, 36, 0.1);
      }

      .mutqin-app-loader__track::after {
        position: absolute;
        inset-block: 0;
        width: 42%;
        border-radius: inherit;
        content: '';
        background: linear-gradient(90deg, #b58635, #dcb66f);
        animation: mutqin-loader-track 1.2s cubic-bezier(.4, 0, .2, 1) infinite;
      }

      @keyframes mutqin-loader-ring {
        0%, 100% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(90deg) scale(1.035); }
      }

      @keyframes mutqin-loader-logo {
        0%, 100% { transform: scale(1); opacity: .94; }
        50% { transform: scale(1.055); opacity: 1; }
      }

      @keyframes mutqin-loader-build {
        0%, 100% { transform: scaleY(.35); opacity: .42; }
        48% { transform: scaleY(1); opacity: 1; }
      }

      @keyframes mutqin-loader-track {
        0% { transform: translateX(-145%); }
        100% { transform: translateX(345%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .mutqin-app-loader__ring,
        .mutqin-app-loader__logo,
        .mutqin-app-loader__build i,
        .mutqin-app-loader__track::after {
          animation: none !important;
        }
      }
    </style>

  </head>
  <body>
    
    <div id="app-boot-loader" role="status" aria-label="جاري تحميل متقن">
      <div class="mutqin-app-loader">
        <div class="mutqin-app-loader__stage" aria-hidden="true">
          <span class="mutqin-app-loader__ring"></span>
          <img class="mutqin-app-loader__logo" src="/branding/icon-color.svg" alt="" draggable="false" />
        </div>
        <div class="mutqin-app-loader__build" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </div>
        <span class="mutqin-app-loader__track" aria-hidden="true"></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
