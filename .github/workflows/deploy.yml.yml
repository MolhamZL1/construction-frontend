name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutqin-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Frontend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" << 'REMOTE'

          set -e

          cd /var/www/mutqin/frontend

          echo "Checking repository..."
          git status --short

          if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: Local tracked changes exist on server."
              exit 1
          fi

          echo "Pulling latest frontend..."
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          echo "Installing dependencies..."
          npm ci

          echo "Building frontend..."
          npm run build

          test -f dist/index.html

          echo "Testing Nginx..."
          curl -fsSI http://127.0.0.1/ > /dev/null

          echo "Frontend deployed successfully."
          REMOTE